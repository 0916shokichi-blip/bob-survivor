<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ぼぶサバイバー</title>
<style>
  :root {
    --bg: #0f1114;
    --bg-deep: #080810;
    --ink: #ece6d6;
    --dim: #8a8576;
    --hood: #171717;
    --hood-deep: #0a0a0a;
    --eye: #cfc7b4;
    --eye-bright: #f4f1ea;
    --accent: #b8a4d4;       /* 内省の紫 */
    --accent-soft: #6f6691;
    --gold: #f4d77e;          /* 進化武器のフラッシュ */
    --danger: #c46a6a;
    --bonnou: #1a0f14;
    --bonnou-eye: #c44a4a;
    --xp: #6e82a8;            /* 月光の青 */
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg-deep);
    color: var(--ink);
    font-family: -apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    letter-spacing: 0.06em;
    overflow: hidden;
    height: 100%;
  }

  #app {
    position: fixed; inset: 0;
    display: grid;
    place-items: center;
    background:
      radial-gradient(ellipse at center, #14161c 0%, var(--bg-deep) 70%);
  }

  #stage {
    position: relative;
    width: min(960px, 100vw);
    height: min(600px, 100vh);
  }

  canvas {
    display: block;
    width: 100%; height: 100%;
    background: var(--bg);
    image-rendering: pixelated;
  }

  /* HUD */
  .hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .hud-top {
    position: absolute;
    top: 12px; left: 16px; right: 16px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px;
  }
  .hud-top .left, .hud-top .right { display: flex; gap: 18px; align-items: center; }
  .hp {
    display: inline-flex; gap: 4px;
  }
  .hp .heart {
    width: 14px; height: 14px;
    background: var(--danger);
    clip-path: polygon(50% 15%, 90% 35%, 90% 60%, 50% 95%, 10% 60%, 10% 35%);
    opacity: 1;
  }
  .hp .heart.empty { opacity: 0.18; }
  .timer { font-weight: 200; font-size: 18px; letter-spacing: 0.18em; }
  .level {
    color: var(--accent);
    font-weight: 600;
  }

  /* XP bar */
  .xp-bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 4px;
    background: rgba(255,255,255,0.05);
  }
  .xp-bar .fill {
    height: 100%;
    width: 0%;
    background: var(--xp);
    transition: width 120ms linear;
  }

  /* Build sidebar */
  .build {
    position: absolute;
    top: 44px; left: 16px;
    display: flex; flex-direction: column; gap: 6px;
    font-size: 11px;
    color: var(--dim);
    max-width: 220px;
  }
  .build .item {
    display: flex; gap: 8px; align-items: center;
  }
  .build .name { color: var(--ink); }
  .build .lv { color: var(--accent); }
  .build .item.evolved .name { color: var(--gold); }
  .build .item.evolved .lv { color: var(--gold); }

  /* Modal */
  .overlay {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(8, 8, 16, 0.88);
    backdrop-filter: blur(2px);
    pointer-events: auto;
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .modal {
    width: min(560px, 92%);
    padding: 28px 32px;
    border: 1px solid #20232a;
    background: var(--bg);
  }
  .modal h2 {
    margin: 0 0 4px;
    font-weight: 200;
    font-size: 14px;
    color: var(--dim);
    letter-spacing: 0.24em;
    text-transform: uppercase;
  }
  .modal .lead {
    margin: 0 0 20px;
    font-weight: 200;
    font-size: 22px;
    color: var(--ink);
    letter-spacing: 0.16em;
  }
  .choices {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }
  .choice {
    display: flex; gap: 14px; align-items: center;
    padding: 14px 16px;
    border: 1px solid #20232a;
    background: #11141a;
    cursor: pointer;
    transition: border-color 120ms, background 120ms, transform 80ms;
    text-align: left;
    color: var(--ink);
    font-family: inherit;
  }
  .choice:hover, .choice:focus { border-color: var(--accent-soft); background: #14161e; outline: none; }
  .choice:active { transform: translateY(1px); }
  .choice .glyph {
    width: 36px; height: 36px;
    flex-shrink: 0;
    display: grid; place-items: center;
    background: #0a0c10;
    border: 1px solid #20232a;
    color: var(--accent);
    font-size: 18px;
  }
  .choice.evo .glyph { color: var(--gold); border-color: var(--gold); }
  .choice .meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .choice .title { font-size: 14px; }
  .choice .title .tag { color: var(--accent); font-size: 11px; margin-left: 8px; }
  .choice.evo .title .tag { color: var(--gold); }
  .choice .desc { font-size: 11px; color: var(--dim); letter-spacing: 0.12em; }

  /* Result screen */
  .result h2 { color: var(--accent); }
  .result.win h2 { color: var(--gold); }
  .result .stats {
    display: grid; grid-template-columns: auto 1fr; gap: 6px 18px;
    font-size: 12px; color: var(--dim);
    margin: 16px 0 22px;
  }
  .result .stats .v { color: var(--ink); }
  .result .carry {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.18em;
    margin: 0 0 22px;
    opacity: 0.7;
  }
  .result button.again {
    padding: 10px 22px;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--accent-soft);
    font-family: inherit;
    letter-spacing: 0.18em;
    cursor: pointer;
    font-size: 12px;
  }
  .result button.again:hover { border-color: var(--accent); }

  /* Title screen */
  .title-screen {
    text-align: center;
  }
  .title-screen .title {
    font-weight: 200;
    font-size: 36px;
    letter-spacing: 0.32em;
    margin: 0 0 4px;
  }
  .title-screen .subtitle {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.4em;
    margin: 0 0 28px;
    text-transform: uppercase;
  }
  .title-screen .keys {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.16em;
    margin: 22px 0 24px;
    line-height: 1.8;
  }
  .title-screen .keys kbd {
    display: inline-block;
    padding: 1px 6px;
    border: 1px solid #20232a;
    border-radius: 2px;
    color: var(--ink);
    background: #11141a;
    font-family: inherit;
    font-size: 10px;
  }

  /* Floating evolved banner */
  .banner {
    position: absolute;
    top: 32%; left: 50%;
    transform: translate(-50%, -50%);
    color: var(--gold);
    font-size: 22px;
    letter-spacing: 0.32em;
    font-weight: 200;
    pointer-events: none;
    opacity: 0;
    text-shadow: 0 0 18px rgba(244, 215, 126, 0.35);
  }
  .banner.show {
    animation: banner 1.6s ease-out forwards;
  }
  @keyframes banner {
    0%   { opacity: 0; transform: translate(-50%, -40%); }
    20%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -50%); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game" width="960" height="600"></canvas>

    <div class="hud">
      <div class="hud-top">
        <div class="left">
          <div class="hp" id="hp"></div>
          <div class="level">Lv <span id="lv">1</span></div>
        </div>
        <div class="right">
          <div class="timer" id="timer">01:00</div>
        </div>
      </div>
      <div class="build" id="build"></div>
      <div class="xp-bar"><div class="fill" id="xpfill"></div></div>
    </div>

    <div class="banner" id="banner"></div>

    <div class="overlay" id="overlay">
      <div class="modal" id="modal"></div>
    </div>
  </div>
</div>

<script>
"use strict";

// ============================================================
// Data — 武器・パッシブ・進化はここで完結（追加はこのテーブルだけ）
// ============================================================

const WEAPONS = {
  toi: {
    id: 'toi',
    name: '問い',
    glyph: '?',
    desc: '投げかけた問いが、煩悩を貫く',
    maxLv: 8,
    levelDesc: lv => lv === 1 ? '取得：問いを 1 本発射' :
                     lv === 8 ? '頻度↑ ダメージ↑ 進化準備完了' :
                     `本数 +${lv === 4 ? 1 : 0}　ダメージ +1`,
  },
  kotoba: {
    id: 'kotoba',
    name: '言葉',
    glyph: '◯',
    desc: '周囲に響く言葉が、近づく煩悩を払う',
    maxLv: 8,
    levelDesc: lv => lv === 1 ? '取得：周囲に円形範囲ダメージ' :
                     lv === 8 ? '響きが極まる、進化準備完了' :
                     '響きの幅と威力が増す',
  },
  naisei: {
    id: 'naisei',
    name: '内省',
    glyph: '◐',
    desc: '己の周りを巡る内省が、触れた煩悩を消す',
    maxLv: 8,
    levelDesc: lv => lv === 1 ? '取得：周囲を 1 個の盾が公転' :
                     lv === 8 ? '巡る思索が極まる、進化準備完了' :
                     lv === 3 || lv === 6 ? '盾の数が増える' :
                     '内省の威力が増す',
  },
  kansatsu: {
    id: 'kansatsu',
    name: '観察',
    glyph: '|',
    desc: '見据えた一直線の上の煩悩を、まとめて貫く',
    maxLv: 8,
    levelDesc: lv => lv === 1 ? '取得：最寄りの敵に貫通ビーム' :
                     lv === 8 ? '視線が極まる' :
                     '頻度↑　ダメージ↑',
  },
  nenge: {
    id: 'nenge',
    name: '拈華',
    glyph: '花',
    desc: '向いた方向に華をかかげ、近づく煩悩をしばし止める',
    maxLv: 5,
    levelDesc: lv => lv === 1 ? '取得：扇形の停止フィールド' :
                     `射程 +　停止時間 +`,
  },
};

const PASSIVES = {
  chinmoku: {
    id: 'chinmoku', name: '沈黙', glyph: '〜',
    desc: 'すべての武器のクールダウンが短くなる',
    maxLv: 5,
    levelDesc: lv => `攻撃間隔 -${lv * 8}%`,
  },
  meiseki: {
    id: 'meiseki', name: '明晰さ', glyph: '✦',
    desc: '射程と弾速が伸びる',
    maxLv: 5,
    levelDesc: lv => `範囲・速度 +${lv * 12}%`,
  },
  nintai: {
    id: 'nintai', name: '忍耐', glyph: '＋',
    desc: '体力の上限が増える',
    maxLv: 5,
    levelDesc: lv => `最大 HP +${lv}`,
  },
  ayumi: {
    id: 'ayumi', name: '歩み', glyph: '→',
    desc: '足取りが軽くなる',
    maxLv: 5,
    levelDesc: lv => `移動速度 +${lv * 12}%`,
  },
  kizuki: {
    id: 'kizuki', name: '気づき', glyph: '✧',
    desc: '月光の粒（XP）を多く受け取る',
    maxLv: 5,
    levelDesc: lv => `XP 取得 +${lv * 20}%`,
  },
  kokyu: {
    id: 'kokyu', name: '呼吸', glyph: '〇',
    desc: '一定時間ごとに HP が 1 戻る。Lv で間隔が短くなる',
    maxLv: 5,
    levelDesc: lv => `${(7 - lv * 0.9).toFixed(1)}s ごとに HP +1`,
  },
  chomei: {
    id: 'chomei', name: '澄明', glyph: '◇',
    desc: 'すべての武器のダメージが上がる',
    maxLv: 3,
    levelDesc: lv => `全武器ダメージ +${lv}`,
  },
  fudo: {
    id: 'fudo', name: '不動', glyph: '石',
    desc: '立ち止まっている間、被弾をすり抜けることがある',
    maxLv: 3,
    levelDesc: lv => `静止時 被弾 ${lv * 25}% で無効`,
  },
  kanpo: {
    id: 'kanpo', name: '緩歩', glyph: '歩',
    desc: '足取りが緩む。代わりに間合いが詰まり、攻撃も短く',
    maxLv: 3,
    levelDesc: lv => `移動 -${lv * 10}%　攻撃間隔 -${lv * 10}%`,
  },
  yohaku: {
    id: 'yohaku', name: '余白', glyph: '空',
    desc: '近くに煩悩がいない時、一撃が重くなる',
    maxLv: 3,
    levelDesc: lv => `周囲に煩悩 0 で 全ダメ +${lv * 30}%`,
  },
  seiza: {
    id: 'seiza', name: '静坐', glyph: '座',
    desc: '被弾後、立ち直りが長くなる',
    maxLv: 3,
    levelDesc: lv => `被ダメ間隔 +${(lv * 0.15).toFixed(2)}s`,
  },
  kekka: {
    id: 'kekka', name: '結跏', glyph: '坐',
    desc: '静止していると、内省の巡りが速くなる',
    maxLv: 3,
    levelDesc: lv => `静止 0.6s 以上で 内省の速度 +${lv * 25}%`,
  },
  ichigo: {
    id: 'ichigo', name: '一期一会', glyph: '会',
    desc: '一度払った三毒は、二度目から倍に効く',
    maxLv: 1,
    levelDesc: lv => '既出の三毒へのダメ ×2',
  },
};

const EVOLUTIONS = [
  {
    id: 'socratic',
    name: 'ソクラテス的問答',
    desc: '問いが応答を呼び、応答がまた問いを呼ぶ',
    requires: { weapon: 'toi', weaponLv: 8, passive: 'chinmoku', passiveLv: 3 },
    glyph: '?!',
  },
  {
    id: 'bensho',
    name: '弁証法',
    desc: '正と反が重なり、合となって響く',
    requires: { weapon: 'kotoba', weaponLv: 8, passive: 'meiseki', passiveLv: 3 },
    glyph: '∞',
  },
  {
    id: 'kanso',
    name: '観想',
    desc: '巡る内省が深まり、世界を静かに照らす',
    requires: { weapon: 'naisei', weaponLv: 8, passive: 'nintai', passiveLv: 3 },
    glyph: '◉',
  },
];

// 武器ごとの進化情報（HUD / 結果画面で参照）
const WEAPON_EVOLUTIONS = {
  toi: { evoId: 'socratic', evoName: 'ソクラテス的問答' },
  kotoba: { evoId: 'bensho', evoName: '弁証法' },
  naisei: { evoId: 'kanso', evoName: '観想' },
};

// ============================================================
// State
// ============================================================

const W = 960, H = 600;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const keys = new Set();
window.addEventListener('keydown', e => {
  keys.add(e.key.toLowerCase());
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
});
window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));

let state; // game state object

function newState() {
  return {
    phase: 'title',  // 'title' | 'play' | 'levelup' | 'win' | 'lose'
    elapsed: 0,
    lastBlink: 0,
    blinkUntil: 0,
    nextBlinkAt: 3500 + Math.random() * 3500,
    player: {
      x: W / 2, y: H / 2,
      r: 14,
      hp: 3, maxHp: 3,
      iframeUntil: 0,
      moveSpeed: 170,
      facing: { x: 1, y: 0 },
    },
    enemies: [],
    projectiles: [],
    orbs: [],
    weapons: { toi: 1 },   // id -> level (0 = unowned)。問い Lv1 を初期装備として開始
    passives: {},  // id -> level
    evolved: {},   // evoId -> true
    weaponState: {
      toi: { cd: 0 },
      kotoba: { cd: 0 },
      naisei: { angle: 0 },
      kansatsu: { cd: 0.6 },  // ゲーム開始直後にいきなり撃たない
      nenge: { cd: 1.5 },     // 拈華も序盤に連発しない
    },
    level: 1,
    xp: 0,
    xpNext: 5,
    spawnTimer: 0,
    spawnInterval: 1.0,
    healTimer: 0,             // 呼吸パッシブ用の蓄積タイマー
    stillTime: 0,             // 不動・結跏：移動していない継続秒数
    encounteredTypes: new Set(), // 一期一会：一度撃破した三毒の種類
    kills: 0,
    killsByType: { jin: 0, ton: 0, chi: 0 }, // 三毒別撃破数（lifetime 集計用）
    bowUntil: 0, // 要素 5 強化：撃破直後の頭下げ演出タイマー
    pendingLevels: 0,
  };
}

// ============================================================
// Lifetime — 過去のセッションが背景に滲む（要素 1：データ永続性）
// ============================================================
// localStorage に累計を持つ。試合終了時に現セッションの数値を加算。
// 背景描画には log スケールで滑らかに反映（オーバー演出を避けるため）。

const LIFETIME_KEY = 'bobsurv-lifetime-v1';
let lifetime = loadLifetime();

function loadLifetime() {
  try {
    const raw = localStorage.getItem(LIFETIME_KEY);
    if (!raw) return { plays: 0, wins: 0, kills: 0, killsByType: { jin: 0, ton: 0, chi: 0 } };
    const v = JSON.parse(raw);
    return {
      plays: v.plays | 0,
      wins: v.wins | 0,
      kills: v.kills | 0,
      killsByType: {
        jin: v.killsByType?.jin | 0,
        ton: v.killsByType?.ton | 0,
        chi: v.killsByType?.chi | 0,
      },
    };
  } catch { return { plays: 0, wins: 0, kills: 0, killsByType: { jin: 0, ton: 0, chi: 0 } }; }
}

function saveLifetime(win) {
  lifetime.plays += 1;
  if (win) lifetime.wins += 1;
  lifetime.kills += state.kills;
  lifetime.killsByType.jin += state.killsByType.jin;
  lifetime.killsByType.ton += state.killsByType.ton;
  lifetime.killsByType.chi += state.killsByType.chi;
  try { localStorage.setItem(LIFETIME_KEY, JSON.stringify(lifetime)); } catch {}
}

// 累計の浸透度（0..1）。10 撃破=0.4 / 100 撃破=0.8 / 316 撃破≈1.0
function lifetimeTint() {
  return Math.min(1, Math.log10(lifetime.kills + 1) / 2.5);
}

// ============================================================
// Drawing — ぼぶ
// ============================================================

function drawBob(x, y, scale, blinking, focused) {
  // 要素 5 強化：キャラ行動パターン = 哲学表現
  // - 静止 1 秒以上 = 佇み（極小縮み + 微下降）
  // - 撃破直後 0.25s = 頭下げ（さらに下降 + 縮み）
  let yOffset = 0;
  let sMul = 1;
  if (state.phase === 'play') {
    if (state.bowUntil && state.elapsed < state.bowUntil) {
      const p = (state.bowUntil - state.elapsed) / 0.25; // 1 → 0
      yOffset = 1.5 * p;
      sMul = 1 - 0.03 * p;
    } else if (state.stillTime > 1.0) {
      yOffset = 0.5;
      sMul = 0.985;
    }
  }
  const s = scale * sMul;
  const yEff = y + yOffset;
  const left = x - 16 * s, top = yEff - 16 * s;
  const k = state.phase === 'play' || state.phase === 'levelup' ? worldLight() : 0;

  // 終盤、ぼぶの周囲に淡い月光ハロー
  if (k > 0.55) {
    const halo = (k - 0.55) / 0.45;
    const grad = ctx.createRadialGradient(x, y, 8 * s, x, y, 36 * s);
    grad.addColorStop(0, `rgba(244, 241, 234, ${halo * 0.35})`);
    grad.addColorStop(1, 'rgba(244, 241, 234, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, 36 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  // hood silhouette（光が増すほどわずかに明るくなる）
  const hoodShade = 23 + Math.floor(k * 26);  // 23 → 49
  ctx.fillStyle = `rgb(${hoodShade},${hoodShade},${hoodShade})`;
  ctx.beginPath();
  ctx.moveTo(left + 32 * s, top + 6 * s);
  ctx.bezierCurveTo(left + 18 * s, top + 6 * s, left + 12 * s, top + 18 * s, left + 12 * s, top + 32 * s);
  ctx.lineTo(left + 12 * s, top + 58 * s);
  ctx.lineTo(left + 52 * s, top + 58 * s);
  ctx.lineTo(left + 52 * s, top + 32 * s);
  ctx.bezierCurveTo(left + 52 * s, top + 18 * s, left + 46 * s, top + 6 * s, left + 32 * s, top + 6 * s);
  ctx.closePath();
  ctx.fill();
  // inner shadow (face area)
  ctx.fillStyle = '#0a0a0a';
  ctx.beginPath();
  ctx.ellipse(x, yEff - 2 * s, 12 * s, 15 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  // eyes（終盤は冴えが強い）
  const eyeIvory = focused || k > 0.6 ? '#f4f1ea' : '#cfc7b4';
  ctx.fillStyle = eyeIvory;
  const ey = yEff - 2 * s;
  const eyeRy = blinking ? 0.18 : 1.5;
  const eyeRx = 1.5;
  ctx.beginPath();
  ctx.ellipse(x - 4.5 * s, ey, eyeRx * s, eyeRy * s, 0, 0, Math.PI * 2);
  ctx.ellipse(x + 4.5 * s, ey, eyeRx * s, eyeRy * s, 0, 0, Math.PI * 2);
  ctx.fill();
}

// 三毒：瞋（怒り）・貪（欲）・痴（無知）。撃破時に対応する漢字がフロート表示される
const ENEMY_TYPES = {
  jin: {  // 瞋: 赤い角を持つ、素早い、HP 低め
    hpMod: 0,
    speedMul: 1.25,
    rMod: -1,
    color: '#1a0d10',
    eyeColor: '#e25555',
  },
  ton: {  // 貪: 大きく膨らむ、遅い、HP +1
    hpMod: 1,
    speedMul: 0.65,
    rMod: 4,
    color: '#1a1308',
    eyeColor: '#d4a14a',
  },
  chi: {  // 痴: 半透明で群れる、HP 低め、輪郭がぼやける
    hpMod: 0,
    speedMul: 1.0,
    rMod: -1,
    color: '#0e1218',
    eyeColor: '#7e90b8',
    alpha: 0.55,
  },
};

function pickEnemyType(t) {
  // 時間で出現比率を変える：序盤は瞋、中盤は貪、終盤は痴の群れ
  const r = Math.random();
  if (t < 18) return 'jin';
  if (t < 35) return r < 0.65 ? 'jin' : r < 0.92 ? 'ton' : 'chi';
  if (t < 50) return r < 0.4 ? 'jin' : r < 0.7 ? 'ton' : 'chi';
  return r < 0.3 ? 'jin' : r < 0.55 ? 'ton' : 'chi';
}

// 世界の進行度（0..1）。「映す世界を間違えた」テーマで時間経過とともに光に向かう
function worldLight() {
  return Math.min(1, state.elapsed / 60);
}

// 進行率で目の色を象牙色に近づけるブレンド（敵が「自分」に近づく演出）
function dropColorFor(type, k) {
  // 進行率で赤系の目色 → 象牙色（プレイヤーと同色）に近づく
  const ivory = [207, 199, 180]; // #cfc7b4
  const c = ENEMY_TYPES[type].eyeColor;
  // hex → rgb
  const m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(c);
  if (!m) return c;
  const r = parseInt(m[1], 16), g = parseInt(m[2], 16), b = parseInt(m[3], 16);
  const blend = Math.max(0, (k - 0.4) / 0.6); // 0.4 から滑らかに
  const rr = Math.round(r + (ivory[0] - r) * blend);
  const gg = Math.round(g + (ivory[1] - g) * blend);
  const bb = Math.round(b + (ivory[2] - b) * blend);
  return `rgb(${rr},${gg},${bb})`;
}

function drawBonnou(e) {
  const type = ENEMY_TYPES[e.type] || ENEMY_TYPES.jin;
  const k = worldLight();
  // 中盤以降フードが透けていく（敵の見方が変わる）
  const hoodAlpha = Math.max(0.32, 1 - Math.max(0, (k - 0.45) / 0.55) * 0.6);
  // 終盤に内側のシルエットが「ぼぶに似た形」として浮かび上がる
  // 過去セッションがあると浮上開始が微前倒し（要素 10：L1 行為の記憶、テンポだけ変化）
  const innerStart = lifetime.plays > 0 ? 0.54 : 0.6;
  const innerReveal = Math.max(0, (k - innerStart) / (1 - innerStart));
  const t = e.wobble;
  const baseW = 14 + (type.rMod || 0);
  const w = baseW + Math.sin(t) * 1.5;
  const h = 16 + (type.rMod || 0) * 0.7;

  const baseAlpha = type.alpha || 1;
  ctx.globalAlpha = baseAlpha * hoodAlpha;

  // body（フード）
  ctx.fillStyle = type.color;
  ctx.beginPath();
  ctx.ellipse(e.x, e.y, w, h, 0, 0, Math.PI * 2);
  ctx.fill();
  // hood overhang
  ctx.fillStyle = '#050308';
  ctx.beginPath();
  ctx.ellipse(e.x, e.y - 5, w - 1, h * 0.62, 0, 0, Math.PI * 2);
  ctx.fill();

  // 瞋の角（怒りの突起）— 終盤は薄れる
  if (e.type === 'jin' && innerReveal < 0.7) {
    ctx.fillStyle = type.color;
    ctx.beginPath();
    ctx.moveTo(e.x - w * 0.7, e.y - h * 0.5);
    ctx.lineTo(e.x - w * 0.95, e.y - h * 1.0);
    ctx.lineTo(e.x - w * 0.4, e.y - h * 0.65);
    ctx.closePath();
    ctx.moveTo(e.x + w * 0.7, e.y - h * 0.5);
    ctx.lineTo(e.x + w * 0.95, e.y - h * 1.0);
    ctx.lineTo(e.x + w * 0.4, e.y - h * 0.65);
    ctx.closePath();
    ctx.fill();
  }

  // 貪の脈動
  if (e.type === 'ton') {
    const pulse = 0.5 + Math.sin(t * 2) * 0.3;
    ctx.fillStyle = `rgba(212, 161, 74, ${pulse * 0.18})`;
    ctx.beginPath();
    ctx.ellipse(e.x, e.y + 1, w * 0.6, h * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = 1;

  // 内側のシルエット（ぼぶに似た小さな影）— 終盤に浮かぶ
  if (innerReveal > 0) {
    ctx.globalAlpha = innerReveal * 0.85;
    ctx.fillStyle = '#ece6d6';  // ぼぶと同じ象牙色
    ctx.beginPath();
    // 小さなフード姿のシルエット
    ctx.ellipse(e.x, e.y + 1, w * 0.55, h * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // eyes（進行率で象牙色に近づく）
  ctx.globalAlpha = baseAlpha;
  ctx.fillStyle = dropColorFor(e.type, k);
  ctx.beginPath();
  ctx.arc(e.x - 3.5, e.y - 2, 1.2, 0, Math.PI * 2);
  ctx.arc(e.x + 3.5, e.y - 2, 1.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalAlpha = 1;

  // 命中フラッシュ（最後に重ねる）
  if (e.hitFlash > 0) {
    const f = Math.min(1, e.hitFlash / 0.18);
    ctx.strokeStyle = `rgba(244, 241, 234, ${f * 0.85})`;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.ellipse(e.x, e.y, w + 2 + (1 - f) * 4, h + 2 + (1 - f) * 4, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 拈華の停止：足元に淡い円
  if (e.stunUntil && state.elapsed < e.stunUntil) {
    const remain = Math.min(1, (e.stunUntil - state.elapsed) / 1.0);
    ctx.strokeStyle = `rgba(244, 241, 234, ${remain * 0.30})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(e.x, e.y + h * 0.7, w * 0.9, w * 0.32, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
}

// ============================================================
// Stats helpers
// ============================================================

function passiveLv(id) { return state.passives[id] || 0; }
function weaponLv(id) { return state.weapons[id] || 0; }

// ダメージ + 命中フラッシュを 1 箇所に集約。余白・一期一会の倍率はここに集約する
function damageEnemy(e, amount) {
  let mult = yohakuMul();
  if (passiveLv('ichigo') && state.encounteredTypes.has(e.type)) {
    mult *= 2;
  }
  e.hp -= amount * mult;
  e.hitFlash = 0.18;
}

function cooldownMul() {
  // 沈黙 + 緩歩
  return (1 - 0.08 * passiveLv('chinmoku')) * (1 - 0.10 * passiveLv('kanpo'));
}
function rangeMul() {
  return 1 + 0.12 * passiveLv('meiseki');
}
function moveMul() {
  // 歩み + 緩歩（緩歩はマイナス）
  return (1 + 0.12 * passiveLv('ayumi')) * (1 - 0.10 * passiveLv('kanpo'));
}
function xpMul() {
  return 1 + 0.20 * passiveLv('kizuki');
}
function dmgBonus() {
  return passiveLv('chomei');
}
function kokyuInterval() {
  // 0 = 無し、Lv1 = 6.1s、Lv5 = 2.5s
  const lv = passiveLv('kokyu');
  if (!lv) return Infinity;
  return 7 - lv * 0.9;
}
// 静坐：被ダメ後の iframe 持続を伸ばす（基本 0.9s）
function iframeDuration() {
  return 0.9 + 0.15 * passiveLv('seiza');
}
// 不動：「立ち止まっている」と判定する閾値
function isStill() {
  return state.stillTime > 0.15;
}
// 余白：周囲 100px に煩悩がいなければ全ダメ倍率
function yohakuMul() {
  const lv = passiveLv('yohaku');
  if (!lv) return 1;
  const r2 = 100 * 100;
  for (const e of state.enemies) {
    const dx = e.x - state.player.x, dy = e.y - state.player.y;
    if (dx * dx + dy * dy < r2) return 1;
  }
  return 1 + 0.30 * lv;
}

// ============================================================
// Input
// ============================================================

function readMove() {
  let dx = 0, dy = 0;
  if (keys.has('w') || keys.has('arrowup')) dy -= 1;
  if (keys.has('s') || keys.has('arrowdown')) dy += 1;
  if (keys.has('a') || keys.has('arrowleft')) dx -= 1;
  if (keys.has('d') || keys.has('arrowright')) dx += 1;
  if (dx || dy) {
    const m = Math.hypot(dx, dy);
    return { x: dx / m, y: dy / m };
  }
  return { x: 0, y: 0 };
}

// ============================================================
// Spawn / Movement
// ============================================================

function spawnEnemy() {
  // spawn at random edge
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = Math.random() * W; y = -20; }
  else if (side === 1) { x = W + 20; y = Math.random() * H; }
  else if (side === 2) { x = Math.random() * W; y = H + 20; }
  else { x = -20; y = Math.random() * H; }
  // 序盤は 1 撃で倒せるよう HP=1、時間経過で段階的に上昇（最大 4）
  const t = state.elapsed;
  let baseHp;
  if (t < 18) baseHp = 1;
  else if (t < 35) baseHp = 2;
  else if (t < 50) baseHp = 3;
  else baseHp = 4;
  const type = pickEnemyType(t);
  const typeData = ENEMY_TYPES[type];
  const speedTier = Math.min(3, Math.floor(t / 20));
  const baseSpeed = 34 + speedTier * 5 + Math.random() * 12;
  state.enemies.push({
    x, y,
    r: 11 + (typeData.rMod || 0),
    hp: Math.max(1, baseHp + typeData.hpMod),
    speed: baseSpeed * typeData.speedMul,
    wobble: Math.random() * Math.PI * 2,
    xp: 1,
    type,
  });
}

function updateEnemies(dt) {
  state.spawnTimer += dt;
  // density ramps over time（数で押される手応えを出す。HP は別軸で抑える）
  const interval = Math.max(0.28, state.spawnInterval - state.elapsed * 0.014);
  while (state.spawnTimer >= interval) {
    state.spawnTimer -= interval;
    // burst: 25s から 2 体、50s から 3 体
    const burst = state.elapsed < 25 ? 1 : state.elapsed < 50 ? 2 : 3;
    for (let i = 0; i < burst; i++) spawnEnemy();
  }

  for (const e of state.enemies) {
    e.wobble += dt * 6;
    if (e.hitFlash > 0) e.hitFlash -= dt;
    // 拈華：停止中の敵は動かない
    if (e.stunUntil && state.elapsed < e.stunUntil) continue;
    const dx = state.player.x - e.x;
    const dy = state.player.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    e.x += (dx / d) * e.speed * dt;
    e.y += (dy / d) * e.speed * dt;
  }

  // separation (very light, prevents pile up)
  for (let i = 0; i < state.enemies.length; i++) {
    const a = state.enemies[i];
    for (let j = i + 1; j < state.enemies.length; j++) {
      const b = state.enemies[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d2 = dx * dx + dy * dy;
      const minD = a.r + b.r;
      if (d2 < minD * minD && d2 > 0.01) {
        const d = Math.sqrt(d2);
        const push = (minD - d) * 0.5;
        const ux = dx / d, uy = dy / d;
        a.x -= ux * push; a.y -= uy * push;
        b.x += ux * push; b.y += uy * push;
      }
    }
  }
}

// ============================================================
// Weapons
// ============================================================

function nearestEnemy(x, y, max = Infinity) {
  let best = null, bestD = max * max;
  for (const e of state.enemies) {
    const dx = e.x - x, dy = e.y - y;
    const d2 = dx * dx + dy * dy;
    if (d2 < bestD) { bestD = d2; best = e; }
  }
  return best;
}

function fireToi(lv) {
  const baseCount = 1 + Math.floor((lv - 1) / 3); // 1,1,1,2,2,2,3,3
  const count = state.evolved.socratic ? baseCount + 2 : baseCount;
  const dmg = 1 + Math.floor((lv - 1) / 2) + dmgBonus();
  const spread = (count - 1) * 0.16;
  const target = nearestEnemy(state.player.x, state.player.y, 600);
  let dirX = state.player.facing.x, dirY = state.player.facing.y;
  if (target) {
    const dx = target.x - state.player.x, dy = target.y - state.player.y;
    const d = Math.hypot(dx, dy) || 1;
    dirX = dx / d; dirY = dy / d;
  }
  const speed = 380 * rangeMul();
  for (let i = 0; i < count; i++) {
    const angOff = -spread / 2 + (count > 1 ? (i / (count - 1)) * spread : 0);
    const cos = Math.cos(angOff), sin = Math.sin(angOff);
    const vx = dirX * cos - dirY * sin;
    const vy = dirX * sin + dirY * cos;
    state.projectiles.push({
      x: state.player.x, y: state.player.y,
      vx: vx * speed, vy: vy * speed,
      r: 5,
      dmg,
      pierce: state.evolved.socratic ? 999 : 0,
      hits: new Set(),
      life: 1.4 * rangeMul(),
      kind: state.evolved.socratic ? 'socratic' : 'toi',
    });
  }
}

function fireKotoba(lv) {
  const evolved = state.evolved.bensho;
  const radius = (60 + lv * 10) * rangeMul() * (evolved ? 1.4 : 1);
  const dmg = 1 + Math.floor(lv / 2) + (evolved ? 2 : 0) + dmgBonus();
  state.projectiles.push({
    x: state.player.x, y: state.player.y,
    aoe: true,
    r: 0, targetR: radius,
    dmg,
    life: 0.32,
    age: 0,
    hits: new Set(),
    kind: evolved ? 'bensho' : 'kotoba',
  });
}

function fireKansatsu(lv) {
  const target = nearestEnemy(state.player.x, state.player.y, 800);
  if (!target) return;
  const dx = target.x - state.player.x, dy = target.y - state.player.y;
  const d = Math.hypot(dx, dy) || 1;
  const dirX = dx / d, dirY = dy / d;
  const length = (380 + lv * 30) * rangeMul();
  const width = 6;
  const dmg = 2 + Math.floor(lv / 2) + dmgBonus();
  // ビームは即時判定：直線への垂直距離で判定し、線分の中にいる敵に一括ダメージ
  for (const e of state.enemies) {
    const ex = e.x - state.player.x, ey = e.y - state.player.y;
    const t = ex * dirX + ey * dirY;
    if (t < 0 || t > length) continue;
    const px = ex - t * dirX, py = ey - t * dirY;
    const pd2 = px * px + py * py;
    if (pd2 < (e.r + width) * (e.r + width)) {
      damageEnemy(e, dmg);
    }
  }
  // 視覚エフェクト：閃光ライン
  state.projectiles.push({
    x: state.player.x, y: state.player.y,
    beam: true,
    dirX, dirY,
    length,
    width,
    life: 0.22,
    age: 0,
    kind: 'kansatsu',
  });
}

// 拈華：向いた方向に扇形の停止フィールドを置く。ダメージなし、敵を一定時間止める
function fireNenge(lv) {
  let dx = state.player.facing.x, dy = state.player.facing.y;
  if (!dx && !dy) { dx = 1; dy = 0; }
  const d = Math.hypot(dx, dy) || 1;
  const radius = (90 + lv * 18) * rangeMul();
  const halfAngle = Math.PI * 0.34; // 約 ±60 度の扇
  const stunDur = 0.9 + lv * 0.35;
  state.projectiles.push({
    x: state.player.x, y: state.player.y,
    nenge: true,
    dirX: dx / d, dirY: dy / d,
    radius,
    halfAngle,
    stunDur,
    age: 0,
    life: 0.55,
    applied: false,
    kind: 'nenge',
  });
}

function naiseiOrbits() {
  const lv = weaponLv('naisei');
  if (!lv) return [];
  const evolved = state.evolved.kanso;
  const baseCount = 1 + Math.floor(lv / 3);
  const count = evolved ? baseCount + 2 : baseCount;
  const dist = 44 * rangeMul() * (evolved ? 1.3 : 1);
  const out = [];
  for (let i = 0; i < count; i++) {
    const a = state.weaponState.naisei.angle + (Math.PI * 2 * i) / count;
    out.push({ x: state.player.x + Math.cos(a) * dist, y: state.player.y + Math.sin(a) * dist });
  }
  return out;
}

function updateNaisei(dt) {
  const lv = weaponLv('naisei');
  if (!lv) return;
  const evolved = state.evolved.kanso;
  let omega = 2.4 * (evolved ? 1.5 : 1);
  // 結跏：0.6s 以上静止していれば角速度上昇
  const kekkaLv = passiveLv('kekka');
  if (kekkaLv && state.stillTime > 0.6) {
    omega *= 1 + 0.25 * kekkaLv;
  }
  state.weaponState.naisei.angle += dt * omega;
  const dmg = 1 + Math.floor(lv / 3) + (evolved ? 2 : 0) + dmgBonus();
  const orbR = evolved ? 11 : 9;
  for (const orb of naiseiOrbits()) {
    for (const e of state.enemies) {
      const dx = e.x - orb.x, dy = e.y - orb.y;
      if (dx * dx + dy * dy < (e.r + orbR) * (e.r + orbR)) {
        if (!e.naiseiCd || e.naiseiCd <= 0) {
          damageEnemy(e, dmg);
          e.naiseiCd = evolved ? 0.25 : 0.35;
        }
      }
    }
  }
  for (const e of state.enemies) {
    if (e.naiseiCd > 0) e.naiseiCd -= dt;
  }
}

function updateWeapons(dt) {
  // toi or socratic
  const toiLv = weaponLv('toi');
  if (toiLv) {
    const ws = state.weaponState.toi;
    ws.cd -= dt;
    const baseCd = state.evolved.socratic ? 0.18 : (1.1 - toiLv * 0.06);
    if (ws.cd <= 0) {
      fireToi(toiLv);
      ws.cd = baseCd * cooldownMul();
    }
  }
  // kotoba or bensho
  const kotobaLv = weaponLv('kotoba');
  if (kotobaLv) {
    const ws = state.weaponState.kotoba;
    ws.cd -= dt;
    if (ws.cd <= 0) {
      fireKotoba(kotobaLv);
      const baseCd = state.evolved.bensho ? 0.7 : (2.2 - kotobaLv * 0.1);
      ws.cd = baseCd * cooldownMul();
    }
  }
  // naisei: orbit, no cooldown
  updateNaisei(dt);
  // kansatsu: 周期的に最寄りの敵へビーム
  const kansatsuLv = weaponLv('kansatsu');
  if (kansatsuLv) {
    const ws = state.weaponState.kansatsu;
    ws.cd -= dt;
    if (ws.cd <= 0) {
      fireKansatsu(kansatsuLv);
      const baseCd = 2.5 - kansatsuLv * 0.18;
      ws.cd = baseCd * cooldownMul();
    }
  }
  // nenge: 周期的に向いた方向へ扇形の停止フィールド
  const nengeLv = weaponLv('nenge');
  if (nengeLv) {
    const ws = state.weaponState.nenge;
    ws.cd -= dt;
    if (ws.cd <= 0) {
      fireNenge(nengeLv);
      const baseCd = 4.5 - nengeLv * 0.35;  // Lv1: 4.15 → Lv5: 2.75
      ws.cd = baseCd * cooldownMul();
    }
  }
}

function updateProjectiles(dt) {
  for (const p of state.projectiles) {
    if (p.beam) {
      p.age += dt;
      continue;  // 当たり判定は発射時に完了済み、視覚のみ減衰
    }
    if (p.nenge) {
      p.age += dt;
      // 出現時に 1 度だけ範囲内の敵に stun を付与
      if (!p.applied) {
        p.applied = true;
        const minDot = Math.cos(p.halfAngle);
        for (const e of state.enemies) {
          const dx = e.x - p.x, dy = e.y - p.y;
          const d = Math.hypot(dx, dy);
          if (d < 1 || d > p.radius) continue;
          const dot = (dx / d) * p.dirX + (dy / d) * p.dirY;
          if (dot >= minDot) {
            const until = state.elapsed + p.stunDur;
            // 既存の stun より長ければ上書き
            if (!e.stunUntil || e.stunUntil < until) e.stunUntil = until;
          }
        }
      }
      continue;
    }
    if (p.aoe) {
      p.age += dt;
      p.r = (p.age / p.life) * p.targetR;
      // hit anything within radius (once per enemy)
      for (const e of state.enemies) {
        if (p.hits.has(e)) continue;
        const dx = e.x - p.x, dy = e.y - p.y;
        if (dx * dx + dy * dy < p.r * p.r) {
          damageEnemy(e, p.dmg);
          p.hits.add(e);
        }
      }
    } else {
      // ソクラテス的問答の残光トレイル（過去 6 点を記録）
      if (p.kind === 'socratic') {
        if (!p.trail) p.trail = [];
        p.trail.push({ x: p.x, y: p.y });
        if (p.trail.length > 6) p.trail.shift();
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      // collision
      for (const e of state.enemies) {
        if (p.hits.has(e)) continue;
        const dx = e.x - p.x, dy = e.y - p.y;
        if (dx * dx + dy * dy < (e.r + p.r) * (e.r + p.r)) {
          damageEnemy(e, p.dmg);
          p.hits.add(e);
          if (p.pierce <= 0) { p.life = 0; break; }
          p.pierce--;
        }
      }
    }
  }
  state.projectiles = state.projectiles.filter(p =>
    p.nenge ? p.age < p.life :
    p.beam ? p.age < p.life :
    p.aoe ? p.age < p.life :
    p.life > 0
  );
}

// ============================================================
// Collisions / Death / Pickup
// ============================================================

function processDeaths() {
  const survivors = [];
  let died = 0;
  for (const e of state.enemies) {
    if (e.hp <= 0) {
      state.kills++;
      died++;
      if (state.killsByType[e.type] !== undefined) state.killsByType[e.type]++;
      state.encounteredTypes.add(e.type); // 一期一会：撃破した三毒の種類を記録
      state.orbs.push({ x: e.x, y: e.y, value: e.xp, vx: 0, vy: 0 });
    } else {
      survivors.push(e);
    }
  }
  state.enemies = survivors;
  // 要素 5 強化：撃破時に短い頭下げ演出（連続撃破でも上書きで上限あり）
  if (died > 0) state.bowUntil = state.elapsed + 0.25;
}

function updatePlayer(dt) {
  const m = readMove();
  if (m.x || m.y) {
    state.player.x += m.x * state.player.moveSpeed * moveMul() * dt;
    state.player.y += m.y * state.player.moveSpeed * moveMul() * dt;
    state.player.facing = m;
    state.stillTime = 0;
  } else {
    state.stillTime += dt;
  }
  state.player.x = Math.max(20, Math.min(W - 20, state.player.x));
  state.player.y = Math.max(20, Math.min(H - 20, state.player.y));

  // damage on contact
  if (state.elapsed > state.player.iframeUntil) {
    for (const e of state.enemies) {
      const dx = e.x - state.player.x, dy = e.y - state.player.y;
      if (dx * dx + dy * dy < (e.r + state.player.r) * (e.r + state.player.r)) {
        // 不動：静止時、Lv * 25% の確率で被弾を無視（短い iframe だけ与える）
        const fudoLv = passiveLv('fudo');
        if (fudoLv && isStill() && Math.random() < 0.25 * fudoLv) {
          state.player.iframeUntil = state.elapsed + 0.3;
          break;
        }
        state.player.hp -= 1;
        state.player.iframeUntil = state.elapsed + iframeDuration();
        sfx('hit');
        if (state.player.hp <= 0) gameOver();
        break;
      }
    }
  }
}

function updateOrbs(dt) {
  for (const o of state.orbs) {
    const dx = state.player.x - o.x, dy = state.player.y - o.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d < 80) {
      const pull = 240;
      o.x += (dx / d) * pull * dt;
      o.y += (dy / d) * pull * dt;
    }
    if (d < 14) {
      o.collected = true;
      gainXp(o.value);
    }
  }
  state.orbs = state.orbs.filter(o => !o.collected);
}

// ============================================================
// XP / Level up
// ============================================================

function gainXp(v) {
  state.xp += v * xpMul();
  let leveled = false;
  while (state.xp >= state.xpNext) {
    state.xp -= state.xpNext;
    state.level++;
    state.xpNext = Math.round(state.xpNext * 1.35 + 1);
    state.pendingLevels++;
    leveled = true;
  }
  if (leveled) sfx('level');
  else sfx('pickup');
  if (state.pendingLevels > 0 && state.phase === 'play') {
    presentLevelUp();
  }
}

function eligibleEvolutions() {
  const list = [];
  for (const evo of EVOLUTIONS) {
    if (state.evolved[evo.id]) continue;
    const r = evo.requires;
    if (r.weapon && weaponLv(r.weapon) < r.weaponLv) continue;
    if (r.passive && passiveLv(r.passive) < r.passiveLv) continue;
    list.push(evo);
  }
  return list;
}

function buildChoiceList() {
  const evos = eligibleEvolutions();
  const out = [];
  if (evos.length > 0) out.push({ kind: 'evo', evo: evos[0] });

  const ownedWeapons = Object.keys(state.weapons).filter(k => state.weapons[k] > 0);

  const weaponPool = [];
  const unownedWeapons = [];
  for (const id in WEAPONS) {
    const w = WEAPONS[id];
    const lv = weaponLv(id);
    if (lv === 0 && ownedWeapons.length >= 3) continue;
    if (lv >= w.maxLv) continue;
    const entry = { kind: 'weapon', id, nextLv: lv + 1 };
    weaponPool.push(entry);
    if (lv === 0) unownedWeapons.push(entry);
  }

  // 未所持武器が pool にあれば 1 つを優先的に offer に含める
  // （build choice の発見性を上げる：パッシブだけ並んで武器が見えない事故を防ぐ）
  if (unownedWeapons.length > 0) {
    const pick = unownedWeapons[Math.floor(Math.random() * unownedWeapons.length)];
    out.push(pick);
    weaponPool.splice(weaponPool.indexOf(pick), 1);
  }

  const passivePool = [];
  for (const id in PASSIVES) {
    const p = PASSIVES[id];
    const lv = passiveLv(id);
    if (lv >= p.maxLv) continue;
    passivePool.push({ kind: 'passive', id, nextLv: lv + 1 });
  }

  const rest = weaponPool.concat(passivePool);
  if (state.player.hp < state.player.maxHp) rest.push({ kind: 'heal' });
  shuffle(rest);
  while (out.length < 3 && rest.length) out.push(rest.shift());
  return out;
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function applyChoice(c) {
  if (c.kind === 'weapon') {
    state.weapons[c.id] = (state.weapons[c.id] || 0) + 1;
  } else if (c.kind === 'passive') {
    state.passives[c.id] = (state.passives[c.id] || 0) + 1;
    if (c.id === 'nintai') {
      state.player.maxHp += 1;
      state.player.hp += 1;
    }
  } else if (c.kind === 'heal') {
    state.player.hp = state.player.maxHp;
  } else if (c.kind === 'evo') {
    const evo = c.evo;
    state.evolved[evo.id] = true;
    showEvolveBanner(evo.name);
    sfx('evolve');
  }
  state.pendingLevels--;
  if (state.pendingLevels > 0) {
    presentLevelUp();
  } else {
    closeOverlay();
    state.phase = 'play';
  }
  refreshHud();
}

function presentLevelUp() {
  state.phase = 'levelup';
  const choices = buildChoiceList();
  const modal = document.getElementById('modal');
  modal.innerHTML = '';
  const h2 = document.createElement('h2'); h2.textContent = 'LEVEL UP'; modal.appendChild(h2);
  const lead = document.createElement('div'); lead.className = 'lead';
  lead.textContent = `Lv ${state.level} — 何を選ぶ？`;
  modal.appendChild(lead);

  const list = document.createElement('div'); list.className = 'choices';
  choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice' + (c.kind === 'evo' ? ' evo' : '');

    const glyph = document.createElement('div'); glyph.className = 'glyph';
    const meta = document.createElement('div'); meta.className = 'meta';
    const title = document.createElement('div'); title.className = 'title';
    const desc = document.createElement('div'); desc.className = 'desc';

    if (c.kind === 'weapon') {
      const w = WEAPONS[c.id];
      glyph.textContent = w.glyph;
      title.innerHTML = `${w.name} <span class="tag">Lv ${c.nextLv}/${w.maxLv}</span>`;
      desc.textContent = c.nextLv === 1 ? w.desc : w.levelDesc(c.nextLv);
    } else if (c.kind === 'passive') {
      const p = PASSIVES[c.id];
      glyph.textContent = p.glyph;
      title.innerHTML = `${p.name} <span class="tag">Lv ${c.nextLv}/${p.maxLv}</span>`;
      desc.textContent = p.levelDesc(c.nextLv);
    } else if (c.kind === 'heal') {
      glyph.textContent = '♥';
      title.innerHTML = `休息 <span class="tag">heal</span>`;
      desc.textContent = `HP を満タンに戻す`;
    } else if (c.kind === 'evo') {
      glyph.textContent = c.evo.glyph;
      title.innerHTML = `${c.evo.name} <span class="tag">進化</span>`;
      desc.textContent = c.evo.desc;
    }

    btn.appendChild(glyph);
    meta.appendChild(title); meta.appendChild(desc);
    btn.appendChild(meta);
    btn.addEventListener('click', () => applyChoice(c));
    list.appendChild(btn);
  });
  modal.appendChild(list);

  // keyboard 1/2/3
  document.getElementById('overlay').classList.add('show');
  setTimeout(() => list.querySelector('button')?.focus(), 0);
}

function showEvolveBanner(name) {
  const b = document.getElementById('banner');
  b.textContent = name;
  b.classList.remove('show');
  void b.offsetWidth; // restart
  b.classList.add('show');
}

// ============================================================
// HUD
// ============================================================

function refreshHud() {
  // hearts
  const hpEl = document.getElementById('hp');
  hpEl.innerHTML = '';
  for (let i = 0; i < state.player.maxHp; i++) {
    const h = document.createElement('div');
    h.className = 'heart' + (i < state.player.hp ? '' : ' empty');
    hpEl.appendChild(h);
  }
  document.getElementById('lv').textContent = state.level;

  // build sidebar
  const buildEl = document.getElementById('build');
  buildEl.innerHTML = '';
  for (const id in state.weapons) {
    const lv = state.weapons[id]; if (!lv) continue;
    const w = WEAPONS[id];
    const evoInfo = WEAPON_EVOLUTIONS[id];
    const isEvolved = evoInfo && state.evolved[evoInfo.evoId];
    const item = document.createElement('div');
    item.className = 'item' + (isEvolved ? ' evolved' : '');
    item.innerHTML = `<span class="name">${isEvolved ? evoInfo.evoName : w.name}</span> <span class="lv">Lv ${lv}</span>`;
    buildEl.appendChild(item);
  }
  for (const id in state.passives) {
    const lv = state.passives[id]; if (!lv) continue;
    const p = PASSIVES[id];
    const item = document.createElement('div');
    item.className = 'item';
    item.innerHTML = `<span class="name">${p.name}</span> <span class="lv">Lv ${lv}</span>`;
    buildEl.appendChild(item);
  }
}

function refreshTimer() {
  const remain = Math.max(0, 60 - state.elapsed);
  const m = Math.floor(remain / 60), s = Math.floor(remain % 60);
  document.getElementById('timer').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function refreshXpBar() {
  const f = state.xp / state.xpNext;
  document.getElementById('xpfill').style.width = (f * 100) + '%';
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('show');
}

// ============================================================
// Audio (Web Audio, generated)
// ============================================================

let audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch {}
}
function sfx(kind) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  // 要素 11：worldLight で全 sfx を再文脈化。同じ音が文脈で違って聞こえる。
  // pitch: 終盤は ×1.5（明るく、上方）/ release: 終盤は ×1.4（持続長く、余韻）/ gain: 終盤は ×0.85（軽く）
  const k = (typeof state !== 'undefined' && state && state.phase === 'play') ? worldLight() : 0;
  const pitchMul = 1 + k * 0.5;
  const releaseMul = 1 + k * 0.4;
  const gainMul = 1 - k * 0.15;
  const softWave = k >= 0.5;  // 終盤は square/triangle → sine 系に置換して角を取る

  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  if (kind === 'shoot') {
    o.type = softWave ? 'sine' : 'triangle';
    o.frequency.setValueAtTime(620 * pitchMul, t);
    o.frequency.exponentialRampToValueAtTime(360 * pitchMul, t + 0.08 * releaseMul);
    g.gain.setValueAtTime(0.04 * gainMul, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.1 * releaseMul);
    o.start(t); o.stop(t + 0.12 * releaseMul);
  } else if (kind === 'hit') {
    o.type = softWave ? 'triangle' : 'square';
    o.frequency.setValueAtTime(220 * pitchMul, t);
    o.frequency.exponentialRampToValueAtTime(80 * pitchMul, t + 0.18 * releaseMul);
    g.gain.setValueAtTime(0.07 * gainMul, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2 * releaseMul);
    o.start(t); o.stop(t + 0.22 * releaseMul);
  } else if (kind === 'pickup') {
    o.type = 'sine'; o.frequency.setValueAtTime(820 * pitchMul, t);
    o.frequency.exponentialRampToValueAtTime(1200 * pitchMul, t + 0.06 * releaseMul);
    g.gain.setValueAtTime(0.03 * gainMul, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.08 * releaseMul);
    o.start(t); o.stop(t + 0.1 * releaseMul);
  } else if (kind === 'level') {
    o.type = 'sine'; o.frequency.setValueAtTime(520 * pitchMul, t);
    o.frequency.exponentialRampToValueAtTime(880 * pitchMul, t + 0.18 * releaseMul);
    g.gain.setValueAtTime(0.05 * gainMul, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3 * releaseMul);
    o.start(t); o.stop(t + 0.32 * releaseMul);
  } else if (kind === 'evolve') {
    const o2 = audioCtx.createOscillator(); const g2 = audioCtx.createGain();
    o2.connect(g2); g2.connect(audioCtx.destination);
    o.type = 'sine'; o2.type = 'sine';
    o.frequency.setValueAtTime(440 * pitchMul, t); o.frequency.exponentialRampToValueAtTime(880 * pitchMul, t + 0.4 * releaseMul);
    o2.frequency.setValueAtTime(660 * pitchMul, t); o2.frequency.exponentialRampToValueAtTime(1320 * pitchMul, t + 0.4 * releaseMul);
    g.gain.setValueAtTime(0.06 * gainMul, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.5 * releaseMul);
    g2.gain.setValueAtTime(0.04 * gainMul, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.5 * releaseMul);
    o.start(t); o2.start(t); o.stop(t + 0.55 * releaseMul); o2.stop(t + 0.55 * releaseMul);
  }
}

// ============================================================
// Game loop
// ============================================================

let lastT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000 || 0);
  lastT = now;

  if (state.phase === 'play') {
    state.elapsed += dt;
    if (state.elapsed >= 60) { victory(); }
    updatePlayer(dt);
    updateEnemies(dt);
    updateWeapons(dt);
    updateProjectiles(dt);
    processDeaths();
    updateOrbs(dt);
    // 呼吸：一定間隔で HP +1（最大値まで）
    const ki = kokyuInterval();
    if (isFinite(ki)) {
      state.healTimer += dt;
      if (state.healTimer >= ki) {
        state.healTimer = 0;
        if (state.player.hp < state.player.maxHp) {
          state.player.hp += 1;
          refreshHud();
        }
      }
    }
  }

  // blink timer (always tick, not just play)
  if (state.elapsed * 1000 > state.nextBlinkAt && state.elapsed > state.blinkUntil) {
    state.blinkUntil = state.elapsed + 0.13;
    state.nextBlinkAt = (state.elapsed + 3.5 + Math.random() * 3.5) * 1000;
  }

  draw();
  refreshTimer();
  refreshXpBar();

  requestAnimationFrame(frame);
}

function draw() {
  const k = worldLight();
  // bg：暗黒 → 紫が滲む夜明け前 → 月光に染まる白寄り
  // 3 段階を線形補間（0..0.4 / 0.4..0.8 / 0.8..1）
  let bgR, bgG, bgB;
  if (k < 0.4) {
    const u = k / 0.4;
    bgR = 15 + u * 8;   // 15 → 23
    bgG = 17 + u * 6;   // 17 → 23
    bgB = 20 + u * 14;  // 20 → 34
  } else if (k < 0.8) {
    const u = (k - 0.4) / 0.4;
    bgR = 23 + u * 50;
    bgG = 23 + u * 50;
    bgB = 34 + u * 70;
  } else {
    const u = (k - 0.8) / 0.2;
    bgR = 73 + u * 110;
    bgG = 73 + u * 115;
    bgB = 104 + u * 110;
  }
  ctx.fillStyle = `rgb(${bgR|0},${bgG|0},${bgB|0})`;
  ctx.fillRect(0, 0, W, H);

  // 月光ヴィネット（中央が明るく）— 進行と共に強くなる
  // 累計（lifetimeTint）で開始閾値を前倒しし、過去の見送りが薄く残光する
  const lt = lifetimeTint();
  const vignetteStart = 0.2 - lt * 0.15;
  if (k > vignetteStart) {
    const grad = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, Math.max(W, H) * 0.7);
    grad.addColorStop(0, `rgba(244, 241, 234, ${(k - vignetteStart) * 0.25 + lt * 0.04})`);
    grad.addColorStop(1, 'rgba(244, 241, 234, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  // subtle grid (chamber feel) — 光が増すほど薄くする
  const gridAlpha = 0.04 * (1 - k * 0.7);
  ctx.strokeStyle = `rgba(184, 164, 212, ${gridAlpha})`;
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // orbs
  for (const o of state.orbs) {
    ctx.fillStyle = '#6e82a8';
    ctx.beginPath(); ctx.arc(o.x, o.y, 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(110, 130, 168, 0.25)';
    ctx.beginPath(); ctx.arc(o.x, o.y, 6, 0, Math.PI * 2); ctx.fill();
  }

  // enemies
  for (const e of state.enemies) drawBonnou(e);

  // naisei orbs (evolves to 観想)
  const kanso = state.evolved.kanso;
  for (const orb of naiseiOrbits()) {
    if (kanso) {
      ctx.fillStyle = 'rgba(244, 215, 126, 0.9)';
      ctx.beginPath(); ctx.arc(orb.x, orb.y, 7, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(244, 215, 126, 0.5)';
      ctx.beginPath(); ctx.arc(orb.x, orb.y, 11, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(244, 215, 126, 0.2)';
      ctx.beginPath(); ctx.arc(orb.x, orb.y, 15, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(184, 164, 212, 0.85)';
      ctx.beginPath(); ctx.arc(orb.x, orb.y, 6, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(184, 164, 212, 0.35)';
      ctx.beginPath(); ctx.arc(orb.x, orb.y, 9, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // player
  const blinking = state.elapsed < state.blinkUntil;
  const focused = (state.weapons.toi || state.weapons.kotoba || state.weapons.naisei);
  // iframe flash
  const inIframe = state.elapsed < state.player.iframeUntil;
  if (!inIframe || Math.floor(state.elapsed * 14) % 2 === 0) {
    drawBob(state.player.x, state.player.y, 0.7, blinking, !!focused);
  }

  // projectiles
  for (const p of state.projectiles) {
    if (p.beam) {
      const fade = 1 - p.age / p.life;
      ctx.strokeStyle = `rgba(244, 241, 234, ${fade * 0.95})`;
      ctx.lineWidth = 1 + fade * 2.5;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + p.dirX * p.length, p.y + p.dirY * p.length);
      ctx.stroke();
      // 二重線で芯を強調
      ctx.strokeStyle = `rgba(244, 241, 234, ${fade * 0.4})`;
      ctx.lineWidth = 4 + fade * 3;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + p.dirX * p.length, p.y + p.dirY * p.length);
      ctx.stroke();
      continue;
    }
    if (p.aoe) {
      if (p.kind === 'bensho') {
        ctx.strokeStyle = 'rgba(244, 215, 126, 0.85)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = 'rgba(244, 215, 126, 0.45)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.62, 0, Math.PI * 2); ctx.stroke();
      } else {
        ctx.strokeStyle = 'rgba(184, 164, 212, 0.7)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke();
      }
    } else if (p.kind === 'nenge') {
      // 扇形の停止フィールド：薄い象牙色で fade
      const fade = 1 - p.age / p.life;
      const ang = Math.atan2(p.dirY, p.dirX);
      ctx.fillStyle = `rgba(244, 241, 234, ${fade * 0.06})`;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.arc(p.x, p.y, p.radius, ang - p.halfAngle, ang + p.halfAngle);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = `rgba(244, 241, 234, ${fade * 0.32})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.arc(p.x, p.y, p.radius, ang - p.halfAngle, ang + p.halfAngle);
      ctx.closePath();
      ctx.stroke();
    } else if (p.kind === 'socratic') {
      // 残光トレイル
      if (p.trail) {
        for (let i = 0; i < p.trail.length; i++) {
          const tp = p.trail[i];
          const k = i / p.trail.length;
          ctx.fillStyle = `rgba(244, 215, 126, ${0.05 + k * 0.18})`;
          ctx.beginPath(); ctx.arc(tp.x, tp.y, p.r * (0.5 + k * 0.6), 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.fillStyle = '#f4d77e';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(244, 215, 126, 0.32)';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 1.9, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = '#cfc7b4';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
  }

}

// ============================================================
// Game flow
// ============================================================

function startGame() {
  initAudio();
  state = newState();
  state.phase = 'play';
  state.pendingLevels = 1;
  presentLevelUp();
  refreshHud();
}

function gameOver() {
  if (state.phase === 'lose' || state.phase === 'win') return;
  state.phase = 'lose';
  saveLifetime(false);
  showResult(false);
}

function victory() {
  if (state.phase === 'win' || state.phase === 'lose') return;
  state.phase = 'win';
  saveLifetime(true);
  showResult(true);
  sfx('evolve');
}

function showResult(win) {
  const modal = document.getElementById('modal');
  modal.className = 'modal result' + (win ? ' win' : '');
  modal.innerHTML = '';
  const h2 = document.createElement('h2');
  h2.textContent = win ? '世界を見間違えていた' : '煩悩に呑まれた';
  modal.appendChild(h2);
  const lead = document.createElement('div'); lead.className = 'lead';
  // 要素 10：L3 不在への反応。2 回目以降の勝利は接頭で「また、」を滲ませる
  // 核フレーズ「払っていたのは…」は維持、トーンだけ付加
  if (win) {
    lead.textContent = lifetime.wins >= 2
      ? 'また、払っていたのは煩悩ではなかったのかもしれない'
      : '払っていたのは、煩悩ではなかったのかもしれない';
  } else {
    lead.textContent = 'もう一度、問い直そう';
  }
  modal.appendChild(lead);

  const stats = document.createElement('div'); stats.className = 'stats';
  const evoNames = [];
  for (const id in WEAPON_EVOLUTIONS) {
    const info = WEAPON_EVOLUTIONS[id];
    if (state.evolved[info.evoId]) evoNames.push(info.evoName);
  }
  const rows = [
    ['到達 Lv', state.level],
    [win ? '見送ったもの' : '撃破した煩悩', state.kills],
    ['進化武器', evoNames.length ? evoNames.join('、') : '—'],
  ];
  for (const [k, v] of rows) {
    const a = document.createElement('div'); a.textContent = k;
    const b = document.createElement('div'); b.className = 'v'; b.textContent = v;
    stats.appendChild(a); stats.appendChild(b);
  }
  modal.appendChild(stats);

  // 累計（過去の見送り）— 勝利時 + 過去セッションがある時のみ、余白で語る
  if (win && lifetime.kills > state.kills) {
    const carry = document.createElement('div');
    carry.className = 'carry';
    carry.textContent = `これまでに見送ったもの — ${lifetime.kills}`;
    modal.appendChild(carry);
  }

  const btn = document.createElement('button');
  btn.className = 'again';
  btn.textContent = 'もう一度';
  btn.addEventListener('click', () => {
    modal.className = 'modal';
    startGame();
  });
  modal.appendChild(btn);

  document.getElementById('overlay').classList.add('show');
}

// ============================================================
// Title screen
// ============================================================

function showTitle() {
  state = newState();
  const modal = document.getElementById('modal');
  modal.className = 'modal title-screen';
  modal.innerHTML = '';
  const t = document.createElement('div'); t.className = 'title'; t.textContent = 'ぼぶサバイバー';
  const sub = document.createElement('div'); sub.className = 'subtitle'; sub.textContent = '一分間の黙考';
  modal.appendChild(t); modal.appendChild(sub);

  const keys = document.createElement('div'); keys.className = 'keys';
  keys.innerHTML = `
    <div><kbd>WASD</kbd> / <kbd>←↑→↓</kbd> 移動</div>
    <div>武器は自動で発動する</div>
    <div>レベルアップで <kbd>1</kbd>–<kbd>3</kbd> を選ぶ</div>
  `;
  modal.appendChild(keys);

  const btn = document.createElement('button');
  btn.className = 'again';
  btn.textContent = '黙考を始める';
  btn.addEventListener('click', () => { modal.className = 'modal'; startGame(); });
  modal.appendChild(btn);

  document.getElementById('overlay').classList.add('show');
  setTimeout(() => btn.focus(), 0);
}

// number key shortcut for choices
window.addEventListener('keydown', (e) => {
  if (state && state.phase === 'levelup') {
    const idx = ['1','2','3'].indexOf(e.key);
    if (idx >= 0) {
      const list = document.querySelectorAll('#modal .choice');
      if (list[idx]) list[idx].click();
    }
  }
});

// ============================================================
// Boot
// ============================================================

state = newState();
showTitle();
refreshHud();
requestAnimationFrame(frame);

</script>
